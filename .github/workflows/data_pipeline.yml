name: River Watch Data Pipeline

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab

concurrency:
  group: river-watch-data-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Data Pipeline
        env:
          EE_KEY_JSON: ${{ secrets.EE_KEY_JSON }}
          EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/ee_key.json
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f -- "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT

          # Keep secret contents out of the generated shell program and child env.
          printf '%s' "$EE_KEY_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          unset EE_KEY_JSON

          # Run the main generation script
          python scripts/generate_dashboard_data.py
          
      - name: Commit and Push changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add any modified or new files in data/ and app_frontend/imagery/
          git add -- data/ app_frontend/imagery/
          
          # Commit and push only generated changes; fail visibly if push is denied.
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore(data): auto-update satellite imagery and metrics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
